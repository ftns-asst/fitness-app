basePath: /api/v1
definitions:
  CheckEmailRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  CheckEmailResponse:
    properties:
      free:
        type: boolean
    type: object
  ErrorResponse:
    properties:
      key:
        type: string
      message:
        type: string
    type: object
  LogInRequestBody:
    properties:
      email:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  LogInResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  PasswordRecoveryRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  RefreshTokensRequestBody:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  RefreshTokensResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
    type: object
  ResetPasswordRequestBody:
    properties:
      new_password:
        maxLength: 64
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  ResetPasswordResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  SignUpRequestBody:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  SignUpResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  Tokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  UserProfile:
    properties:
      age:
        type: integer
      gender:
        enum:
        - male
        - female
        type: string
      height:
        type: integer
      weight:
        type: integer
    type: object
  UserWithProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile:
        $ref: '#/definitions/UserProfile'
    type: object
  VerifyRecoveryCodeRequestBody:
    properties:
      code:
        maxLength: 6
        minLength: 6
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  VerifyRecoveryCodeResponse:
    properties:
      reset_token:
        type: string
    type: object
host: fitness.nought.ru
info:
  contact: {}
  title: Fitness Assistant API
  version: "1.0"
paths:
  /auth/check-email:
    post:
      consumes:
      - application/json
      operationId: checkEmail
      parameters:
      - description: CheckEmail body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CheckEmailRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CheckEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Check if email is already taken
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      operationId: logIn
      parameters:
      - description: LogIn body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LogInRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LogInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log in an existing user
      tags:
      - auth
  /auth/password-recovery:
    post:
      consumes:
      - application/json
      operationId: passwordRecovery
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PasswordRecoveryRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Recover password by email, sends verification code to email, no response
        data
      tags:
      - auth
  /auth/password-recovery/reset:
    post:
      consumes:
      - application/json
      operationId: resetPassword
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reset password by reset token
      tags:
      - auth
  /auth/password-recovery/verify:
    post:
      consumes:
      - application/json
      operationId: verifyCode
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyRecoveryCodeRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VerifyRecoveryCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Verify otp code
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      operationId: refreshTokens
      parameters:
      - description: RefreshTokens body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RefreshTokensRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RefreshTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Refresh authentication tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      operationId: signUp
      parameters:
      - description: SignUp body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SignUpRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SignUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign up a new user
      tags:
      - auth
  /users/{id}:
    get:
      consumes:
      - application/json
      operationId: getUserByID
      parameters:
      - description: user id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: if true - resposne with user profile
        in: query
        name: withProfile
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserWithProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get user by ID
      tags:
      - users
swagger: "2.0"
