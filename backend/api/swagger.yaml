basePath: /api/v1
definitions:
  CheckEmailRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  CheckEmailResponse:
    properties:
      free:
        type: boolean
    type: object
  CreateExerciseRequestBody:
    properties:
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      is_public:
        type: boolean
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  ErrorResponse:
    properties:
      key:
        type: string
      message:
        type: string
    type: object
  Exercise:
    properties:
      created_at:
        type: string
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      id:
        type: string
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
      owner_id:
        type: string
    type: object
  LogInRequestBody:
    properties:
      email:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  LogInResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  PasswordRecoveryRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  RefreshTokensRequestBody:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  RefreshTokensResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
    type: object
  ResetPasswordRequestBody:
    properties:
      new_password:
        maxLength: 64
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  ResetPasswordResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  SignUpRequestBody:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  SignUpResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  Tokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  UpdateExerciseRequestBody:
    properties:
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      id:
        type: string
      is_public:
        type: boolean
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  UpdateUserProfileRequestBody:
    properties:
      age:
        maximum: 150
        minimum: 1
        type: integer
      gender:
        enum:
        - male
        - female
        type: string
      height:
        maximum: 300
        minimum: 1
        type: integer
      weight:
        maximum: 500
        minimum: 1
        type: integer
    type: object
  User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  UserProfile:
    properties:
      age:
        type: integer
      gender:
        enum:
        - male
        - female
        type: string
      height:
        type: integer
      weight:
        type: integer
    type: object
  UserWithProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile:
        $ref: '#/definitions/UserProfile'
    type: object
  VerifyRecoveryCodeRequestBody:
    properties:
      code:
        maxLength: 6
        minLength: 6
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  VerifyRecoveryCodeResponse:
    properties:
      reset_token:
        type: string
    type: object
host: fitness.nought.ru
info:
  contact: {}
  title: Fitness Assistant API
  version: "1.0"
paths:
  /auth/check-email:
    post:
      consumes:
      - application/json
      operationId: checkEmail
      parameters:
      - description: CheckEmail body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CheckEmailRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CheckEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Check if email is already taken
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      operationId: logIn
      parameters:
      - description: LogIn body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LogInRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LogInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log in an existing user
      tags:
      - auth
  /auth/password-recovery:
    post:
      consumes:
      - application/json
      operationId: passwordRecovery
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PasswordRecoveryRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Recover password by email, sends verification code to email, no response
        data
      tags:
      - auth
  /auth/password-recovery/reset:
    post:
      consumes:
      - application/json
      operationId: resetPassword
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reset password by reset token
      tags:
      - auth
  /auth/password-recovery/verify:
    post:
      consumes:
      - application/json
      operationId: verifyCode
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyRecoveryCodeRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VerifyRecoveryCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Verify otp code
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      operationId: refreshTokens
      parameters:
      - description: RefreshTokens body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RefreshTokensRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/RefreshTokensResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Refresh authentication tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      operationId: signUp
      parameters:
      - description: SignUp body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SignUpRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SignUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign up a new user
      tags:
      - auth
  /equipments:
    get:
      operationId: getEquipments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get all equipment types
      tags:
      - exercises
  /exercises:
    get:
      consumes:
      - application/json
      description: 'Authorization is optional: with a token, own exercises are included
        in the "own" and "all" lists'
      operationId: listExercises
      parameters:
      - description: list type
        enum:
        - own
        - public
        - basic
        - all
        in: query
        name: type
        required: true
        type: string
      - collectionFormat: multi
        description: filter by muscle groups
        in: query
        items:
          type: string
        name: muscle_group
        type: array
      - collectionFormat: multi
        description: filter by equipment
        in: query
        items:
          type: string
        name: equipment
        type: array
      - description: search by name
        in: query
        name: search
        type: string
      - description: page size
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        required: true
        type: integer
      - description: page offset
        in: query
        maximum: 100000
        minimum: 0
        name: offset
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Exercise'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List exercises
      tags:
      - exercises
    post:
      consumes:
      - application/json
      operationId: createExercise
      parameters:
      - description: exercise body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateExerciseRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CreateExerciseRequestBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create exercise
      tags:
      - exercises
  /exercises/{id}:
    delete:
      operationId: deleteExercise
      parameters:
      - description: exercise id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete exercise
      tags:
      - exercises
    get:
      operationId: getExerciseByID
      parameters:
      - description: exercise id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Exercise'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get exercise by ID
      tags:
      - exercises
    patch:
      consumes:
      - application/json
      operationId: updateExercise
      parameters:
      - description: exercise id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: exercise body, id must match path id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateExerciseRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Exercise'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update exercise
      tags:
      - exercises
  /muscle-groups:
    get:
      operationId: getMuscleGroups
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get all muscle groups
      tags:
      - exercises
  /users/{id}:
    get:
      consumes:
      - application/json
      operationId: getUserByID
      parameters:
      - description: user id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: if true - resposne with user profile
        in: query
        name: withProfile
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserWithProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get user by ID
      tags:
      - users
  /users/me:
    get:
      consumes:
      - application/json
      operationId: getMe
      parameters:
      - description: if true - resposne with user profile
        in: query
        name: withProfile
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserWithProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get user by provided access token
      tags:
      - users
  /users/me/profile:
    patch:
      consumes:
      - application/json
      operationId: updateUserProfile
      parameters:
      - description: request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateUserProfileRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserProfile'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Update user profile
      tags:
      - users
swagger: "2.0"
