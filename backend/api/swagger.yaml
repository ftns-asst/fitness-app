basePath: /api/v1
definitions:
  CheckEmailRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  CheckEmailResponse:
    properties:
      free:
        type: boolean
    type: object
  CreateExerciseRequestBody:
    properties:
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      is_public:
        type: boolean
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  CreatePersonalRecordRequestBody:
    properties:
      exercise_id:
        type: string
      reps:
        description: repetitions of the set; with them weight_kg is the weight of
          the set and the record is estimated by a formula
        type: integer
      weight_kg:
        type: number
    required:
    - exercise_id
    - weight_kg
    type: object
  CreatePersonalRecordsRequestBody:
    properties:
      records:
        description: records of different exercises, from 1 to 100
        items:
          $ref: '#/definitions/CreatePersonalRecordRequestBody'
        maxItems: 100
        minItems: 1
        type: array
    required:
    - records
    type: object
  CreateProgramFromDefaultRequestBody:
    properties:
      days_of_week:
        items:
          type: integer
        type: array
      default_program_id:
        type: string
    required:
    - days_of_week
    - default_program_id
    type: object
  CreateProgramRequestBody:
    properties:
      days_of_week:
        items:
          type: integer
        type: array
      goal:
        type: string
      level:
        type: string
      name:
        type: string
      weeks_count:
        type: integer
    required:
    - goal
    - level
    - name
    type: object
  DefaultProgram:
    properties:
      days:
        items:
          $ref: '#/definitions/DefaultProgramDay'
        type: array
      days_per_week:
        type: integer
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      level:
        type: string
      name:
        type: string
      weeks_count:
        type: integer
    type: object
  DefaultProgramDay:
    properties:
      order_index:
        type: integer
      week_number:
        type: integer
      workout_template:
        $ref: '#/definitions/WorkoutTemplate'
    type: object
  DefaultProgramSummary:
    properties:
      days_per_week:
        type: integer
      description:
        type: string
      goal:
        type: string
      id:
        type: string
      level:
        type: string
      name:
        type: string
      weeks_count:
        type: integer
    type: object
  Equipment:
    properties:
      key:
        description: unique key
        type: string
      name:
        description: readable name
        type: string
    type: object
  ErrorResponse:
    properties:
      key:
        type: string
      message:
        type: string
    type: object
  Exercise:
    properties:
      created_at:
        type: string
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      id:
        type: string
      is_public:
        type: boolean
      media:
        $ref: '#/definitions/Media'
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
      owner_id:
        type: string
    type: object
  LogInRequestBody:
    properties:
      email:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  LogInResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  MeasurementExercise:
    properties:
      exercise_id:
        type: string
      exercise_name:
        type: string
    type: object
  Media:
    properties:
      id:
        type: string
      type:
        type: string
      url:
        description: temporary url for downloading
        type: string
    type: object
  MuscleGroup:
    properties:
      key:
        description: unique key
        type: string
      name:
        description: readable name
        type: string
    type: object
  PasswordRecoveryRequestBody:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  PersonalRecord:
    properties:
      created_at:
        type: string
      exercise_id:
        type: string
      exercise_name:
        type: string
      id:
        type: string
      is_calculated:
        description: estimated by a formula, not lifted for one rep
        type: boolean
      weight_kg:
        type: number
    type: object
  Program:
    properties:
      created_at:
        type: string
      days_of_week:
        items:
          type: integer
        type: array
      default_program_id:
        type: string
      goal:
        type: string
      id:
        type: string
      level:
        type: string
      name:
        type: string
      required_measurements:
        description: exercises with percent load and without a personal record, empty
          if the program can start or was started
        items:
          $ref: '#/definitions/MeasurementExercise'
        type: array
      source_kind:
        type: string
      start_date:
        format: date
        type: string
      state:
        type: string
      updated_at:
        type: string
      weeks:
        items:
          $ref: '#/definitions/ProgramWeek'
        type: array
      weeks_count:
        type: integer
    type: object
  ProgramDay:
    properties:
      day_of_week:
        type: integer
      exercises:
        items:
          $ref: '#/definitions/ProgramDayExercise'
        type: array
    type: object
  ProgramDayExercise:
    properties:
      exercise_id:
        type: string
      exercise_name:
        type: string
      id:
        type: string
      order_index:
        type: integer
      rest_seconds:
        type: integer
      sets:
        type: integer
      target_percent_1rm:
        description: load as percent of the personal record, either weight or percent
          is set
        type: number
      target_reps:
        type: integer
      target_weight_kg:
        type: number
    type: object
  ProgramDayExerciseInput:
    properties:
      exercise_id:
        type: string
      rest_seconds:
        type: integer
      sets:
        type: integer
      target_percent_1rm:
        description: load as percent of the personal record, either weight or percent
          is set
        type: number
      target_reps:
        type: integer
      target_weight_kg:
        type: number
    required:
    - exercise_id
    type: object
  ProgramDayInput:
    properties:
      day_of_week:
        type: integer
      exercises:
        items:
          $ref: '#/definitions/ProgramDayExerciseInput'
        type: array
    type: object
  ProgramSummary:
    properties:
      created_at:
        type: string
      days_of_week:
        items:
          type: integer
        type: array
      default_program_id:
        type: string
      goal:
        type: string
      id:
        type: string
      level:
        type: string
      name:
        type: string
      source_kind:
        type: string
      start_date:
        format: date
        type: string
      state:
        type: string
      updated_at:
        type: string
      weeks_count:
        type: integer
    type: object
  ProgramWeek:
    properties:
      days:
        items:
          $ref: '#/definitions/ProgramDay'
        type: array
      week_number:
        type: integer
    type: object
  ProgramWeekInput:
    properties:
      days:
        items:
          $ref: '#/definitions/ProgramDayInput'
        type: array
    type: object
  RefreshTokensRequestBody:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  ReplaceProgramStructureRequestBody:
    properties:
      days_of_week:
        items:
          type: integer
        type: array
      weeks:
        description: position is the week number, weeks_count becomes their number
        items:
          $ref: '#/definitions/ProgramWeekInput'
        type: array
    type: object
  ReplaceProgramWeekRequestBody:
    properties:
      days:
        items:
          $ref: '#/definitions/ProgramDayInput'
        type: array
    type: object
  ResetPasswordRequestBody:
    properties:
      new_password:
        maxLength: 64
        minLength: 8
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  ResetPasswordResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  SignUpRequestBody:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  SignUpResponse:
    properties:
      tokens:
        $ref: '#/definitions/Tokens'
      user:
        $ref: '#/definitions/User'
    type: object
  StartProgramResponse:
    properties:
      created_at:
        type: string
      days_of_week:
        items:
          type: integer
        type: array
      default_program_id:
        type: string
      finished_program_id:
        type: string
      goal:
        type: string
      id:
        type: string
      level:
        type: string
      name:
        type: string
      required_measurements:
        description: exercises with percent load and without a personal record, empty
          if the program can start or was started
        items:
          $ref: '#/definitions/MeasurementExercise'
        type: array
      source_kind:
        type: string
      start_date:
        format: date
        type: string
      state:
        type: string
      updated_at:
        type: string
      weeks:
        items:
          $ref: '#/definitions/ProgramWeek'
        type: array
      weeks_count:
        type: integer
    type: object
  Tokens:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  UpdateExerciseMediaRequestBody:
    properties:
      media_type:
        enum:
        - image
        - video
        type: string
    required:
    - media_type
    type: object
  UpdateExerciseMediaResponse:
    properties:
      media:
        $ref: '#/definitions/Media'
      upload_url:
        description: temporary url for uploading the file with PUT
        type: string
    type: object
  UpdateExerciseRequestBody:
    properties:
      description:
        type: string
      equipment:
        items:
          type: string
        type: array
      id:
        type: string
      is_public:
        type: boolean
      muscle_groups:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  UpdateProgramRequestBody:
    properties:
      days_of_week:
        description: an empty list removes all days, null or no field changes nothing
        items:
          type: integer
        type: array
      goal:
        type: string
      level:
        type: string
      name:
        type: string
      weeks_count:
        type: integer
    type: object
  UpdateUserProfileRequestBody:
    properties:
      age:
        maximum: 150
        minimum: 1
        type: integer
      gender:
        enum:
        - male
        - female
        type: string
      height:
        maximum: 300
        minimum: 1
        type: integer
      weight:
        maximum: 500
        minimum: 1
        type: integer
    type: object
  User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  UserProfile:
    properties:
      age:
        type: integer
      gender:
        enum:
        - male
        - female
        type: string
      height:
        type: integer
      weight:
        type: integer
    type: object
  UserWithProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      profile:
        $ref: '#/definitions/UserProfile'
    type: object
  VerifyRecoveryCodeRequestBody:
    properties:
      code:
        maxLength: 6
        minLength: 6
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  VerifyRecoveryCodeResponse:
    properties:
      reset_token:
        type: string
    type: object
  WorkoutTemplate:
    properties:
      equipment:
        items:
          type: string
        type: array
      exercises:
        items:
          $ref: '#/definitions/WorkoutTemplateExercise'
        type: array
      focus:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  WorkoutTemplateExercise:
    properties:
      exercise_id:
        type: string
      exercise_name:
        type: string
      order_index:
        type: integer
      rest_seconds:
        type: integer
      sets:
        type: integer
      target_percent_1rm:
        description: load as percent of the personal record
        type: number
      target_reps:
        type: integer
    type: object
host: fitness.nought.ru
info:
  contact: {}
  title: Fitness Assistant API
  version: "1.0"
paths:
  /admin/exercise/{id}/media:
    delete:
      operationId: deleteExerciseMedia
      parameters:
      - description: exercise id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete exercise media
      tags:
      - exercises
    put:
      consumes:
      - application/json
      description: Creates media if exercise has none. The file must be uploaded to
        upload_url with PUT, the stored media type is updated if it differs
      operationId: updateExerciseMedia
      parameters:
      - description: exercise id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: media body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateExerciseMediaRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateExerciseMediaResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get url for uploading exercise media
      tags:
      - exercises
  /auth/check-email:
    post:
      consumes:
      - application/json
      operationId: checkEmail
      parameters:
      - description: CheckEmail body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CheckEmailRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CheckEmailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Check if email is already taken
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      operationId: logIn
      parameters:
      - description: LogIn body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LogInRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LogInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Log in an existing user
      tags:
      - auth
  /auth/password-recovery:
    post:
      consumes:
      - application/json
      operationId: passwordRecovery
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PasswordRecoveryRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Recover password by email, sends verification code to email, no response
        data
      tags:
      - auth
  /auth/password-recovery/reset:
    post:
      consumes:
      - application/json
      operationId: resetPassword
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reset password by reset token
      tags:
      - auth
  /auth/password-recovery/verify:
    post:
      consumes:
      - application/json
      operationId: verifyCode
      parameters:
      - description: Request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/VerifyRecoveryCodeRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VerifyRecoveryCodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Verify otp code
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      operationId: refreshTokens
      parameters:
      - description: RefreshTokens body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RefreshTokensRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Tokens'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Refresh authentication tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      operationId: signUp
      parameters:
      - description: SignUp body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SignUpRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/SignUpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign up a new user
      tags:
      - auth
  /default-programs:
    get:
      description: With day_of_week only programs with the same number of days per
        week are returned
      operationId: listDefaultPrograms
      parameters:
      - collectionFormat: multi
        description: selected days of week, 1 - Monday, 7 - Sunday
        in: query
        items:
          type: integer
        maximum: 7
        minimum: 1
        name: day_of_week
        type: array
      - description: filter by goal
        enum:
        - strength
        - muscle
        - fitness
        - fat_loss
        - endurance
        in: query
        name: goal
        type: string
      - description: filter by level
        enum:
        - beginner
        - intermediate
        - advanced
        in: query
        name: level
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/DefaultProgramSummary'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List default programs
      tags:
      - programs
  /default-programs/{id}:
    get:
      operationId: getDefaultProgramByID
      parameters:
      - description: default program id
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/DefaultProgram'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get default program with days
      tags:
      - programs
  /equipments:
    get:
      operationId: getEquipments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Equipment'
            type: array
      summary: Get all equipment types
      tags:
      - exercises
  /exercises:
    get:
      consumes:
      - application/json
      description: 'Authorization is optional: with a token, own exercises are included
        in the "own" and "all" lists'
      operationId: listExercises
      parameters:
      - description: list type
        enum:
        - own
        - public
        - basic
        - all
        in: query
        name: type
        required: true
        type: string
      - collectionFormat: multi
        description: filter by muscle groups
        in: query
        items:
          type: string
        name: muscle_group
        type: array
      - collectionFormat: multi
        description: filter by equipment
        in: query
        items:
          type: string
        name: equipment
        type: array
      - description: search by name
        in: query
        name: search
        type: string
      - description: page size
        in: query
        maximum: 1000
        minimum: 1
        name: limit
        required: true
        type: integer
      - description: page offset
        in: query
        maximum: 100000
        minimum: 0
        name: offset
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Exercise'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List exercises
      tags:
      - exercises
    post:
      consumes:
      - application/json
      operationId: createExercise
      parameters:
      - description: exercise body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateExerciseRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Exercise'
        "400":
