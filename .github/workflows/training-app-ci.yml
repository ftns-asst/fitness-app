name: TrainingAppClient CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: training-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Format, build and test (Qt 6.11.2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh
        working-directory: TrainingAppClient

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build libgl1-mesa-dev

      - name: Set up Python for formatting tools
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: |
          $formatVersion = (Get-Content ../.clang-format-version -Raw).Trim()
          python -m pip install "clang-format==$formatVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          clang-format --version

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: linux
          target: desktop
          cache: true
          install-deps: true

      - name: Test formatter version guard
        run: ./tests/scripts/test-format-cpp.ps1

      - name: Run project gates
        run: ./scripts/run-gates.ps1 -BuildDir build/ci -Generator Ninja -QtPrefix $env:QT_ROOT_DIR

      - name: Upload CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: training-app-test-logs
          path: |
            TrainingAppClient/build/ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
